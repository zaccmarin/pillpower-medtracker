<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PillPower - Dashboard{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
    {% block extra_css %}{% endblock %}
    <!-- Montserrat font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: "Montserrat", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 400;
            font-size: 16px;
            line-height: 1.5;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: "proxima-nova", sans-serif;
            font-weight: 600;
        }

        .display-1, .display-2, .display-3, .display-4 {
            font-weight: 300;
        }

        .btn {
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .card-title {
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .form-control {
            font-size: 0.95rem;
        }

        .table {
            font-size: 0.95rem;
        }

        .nav-link {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse-non-md">
                <div class="position-sticky pt-3">
                    
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a href="/" class="text-decoration-none fw-bold text-white">
                                <img src="/static/img/logo-no-background.svg" alt="PillPower" class="img-fluid ml-1" height="100" width="200">
                            </a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'manager_dashboard' %}active{% endif %}" 
                               href="{% url 'manager_dashboard' %}">
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'manager_dashboard_residents' %}active{% endif %}" 
                               href="{% url 'manager_dashboard_residents' %}">
                                Residents
                            </a>
                        </li>
                        {% if user.manager %}
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'manager_dashboard_carers' %}active{% endif %}" 
                               href="{% url 'manager_dashboard_carers' %}">
                                Manage Carers
                            </a>
                            
                        </li>
                        {% endif %}
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'medication_inventory' %}active{% endif %}" 
                               href="{% url 'medication_inventory' %}">
                                Medication
                            </a>
                        </li>
                       
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
