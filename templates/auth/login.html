{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <title>Pillpower.com</title>
</head>

<body class="body-login">
    <div class="login-background"></div>

    <!-- Header -->
    <header class="header p-3 position-absolute start-0 top-0 end-0">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/" class="text-decoration-none fw-bold text-white">
                <img src="{% static 'img/logo-no-background.svg' %}" alt="PillPower" class="img-fluid" height="100" width="200">
            </a>
        </div>
    </header>
    <!-- End of header -->


    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-lg" style="max-width: 400px; width: 100%;">
            <h1 class="text-center mb-4">Sign In</h1>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-center ">
                    <label for="username" class="form-label">Email</label>
                    <input type="text" name="username" id="username" class="form-control text-center" required>
                </div>
                <div class="mb-3 text-center">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-control text-center" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>

            {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
</body>

</html>
