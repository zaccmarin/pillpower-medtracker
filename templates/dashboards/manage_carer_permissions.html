{% extends 'staticpages/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Manage Permissions for {{ carer.user.username }}</h2>
    
    <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="card">
            <div class="card-body">
                {% for field in form %}
                <div class="form-check mb-3">
                    {{ field }}
                    <label class="form-check-label" for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                </div>
                {% endfor %}
                
                <button type="submit" class="btn btn-primary">Save Permissions</button>
                <a href="{% url 'manager_dashboard_carers' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
